<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleaning, statistics and charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-cartesian-dist-min@2.35.2/plotly-cartesian.min.js"></script>
<style>
:root{
  --paper:#FFFFFF; --bg:#FBFBFD; --surface:#F5F5F7; --sunk:#EFEFF3; --fill:#F2F2F5;
  --text:#1D1D1F; --text-2:#5A5A5F; --text-3:#86868B; --line:#D8D8DE; --sep:#E6E6EB;
  --blue:#0071E3; --blue-bg:#EDF4FD; --green:#1D7F3C; --green-bg:#EAF6EE;
  --red:#C8102E; --red-bg:#FCEDEF; --amber:#9A5B00; --amber-bg:#FDF3E6;
  --kw:#A23ABA; --str:#1D7F3C; --num:#B06000; --com:#86868B; --fn:#0055B8;
  --fs-1:28px; --fs-2:21px; --fs-3:18px; --fs-5:15px; --fs-6:13.5px;
  --fs-7:12.5px; --fs-8:11px; --fs-code:12.5px;
  --ui:"Public Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --display:"Newsreader",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:13px; --r-sm:8px; --ease:cubic-bezier(.32,.72,0,1);
  --shadow:0 1px 3px rgba(0,0,0,.05), 0 8px 26px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1C1C1E; --bg:#000; --surface:#161618; --sunk:#232325; --fill:#252527;
  --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#7C7C81; --line:#38383A; --sep:#2C2C2E;
  --blue:#2997FF; --blue-bg:#0D2136; --green:#30D158; --green-bg:#0E2A18;
  --red:#FF453A; --red-bg:#2E1113; --amber:#FF9F0A; --amber-bg:#2C1E06;
  --kw:#D58BF0; --str:#5BD67D; --num:#FFB049; --com:#7C7C81; --fn:#6FA3FF;
  --shadow:0 4px 20px rgba(0,0,0,.5); } }
:root[data-theme="dark"]{
  --paper:#1C1C1E; --bg:#000; --surface:#161618; --sunk:#232325; --fill:#252527;
  --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#7C7C81; --line:#38383A; --sep:#2C2C2E;
  --blue:#2997FF; --blue-bg:#0D2136; --green:#30D158; --green-bg:#0E2A18;
  --red:#FF453A; --red-bg:#2E1113; --amber:#FF9F0A; --amber-bg:#2C1E06;
  --kw:#D58BF0; --str:#5BD67D; --num:#FFB049; --com:#7C7C81; --fn:#6FA3FF;
  --shadow:0 4px 20px rgba(0,0,0,.5); }
*{box-sizing:border-box}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--text); font-family:var(--ui); font-size:var(--fs-5);
  line-height:1.55; -webkit-font-smoothing:antialiased}
.app{max-width:940px; margin:0 auto; padding:24px 20px 70px}
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{margin:0; font-family:var(--display); font-size:var(--fs-1); font-weight:600;
  letter-spacing:-.02em}
h2{margin:0 0 3px; font-family:var(--display); font-size:var(--fs-2); font-weight:600}
h3{margin:0 0 9px; font-size:var(--fs-8); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-3)}
p{margin:0}
.lede{color:var(--text-2); font-size:var(--fs-6); max-width:64ch; margin:4px 0 14px}
.sub2{color:var(--text-2); font-size:var(--fs-6); max-width:64ch; margin:2px 0 12px}
button{font-family:inherit; font-size:inherit}
.ghost{appearance:none; border:1px solid var(--line); background:transparent; color:var(--text-2);
  border-radius:980px; padding:5px 13px; font-size:var(--fs-7); cursor:pointer}
.ghost:hover{background:var(--fill); color:var(--text)}
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
.tab{appearance:none; border:1px solid var(--line); background:transparent; color:var(--text-2);
  border-radius:980px; padding:7px 15px; font-size:var(--fs-7); cursor:pointer}
.tab.on{background:var(--text); border-color:var(--text); color:var(--bg); font-weight:600}
.card{background:var(--paper); border:1px solid var(--sep); border-radius:var(--r);
  box-shadow:var(--shadow); padding:18px 20px; margin-bottom:13px}
.tag{display:inline-block; font-size:var(--fs-8); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--blue); background:var(--blue-bg);
  padding:3px 9px; border-radius:6px}
.kind{font-size:var(--fs-8); color:var(--text-3); letter-spacing:.05em; text-transform:uppercase;
  margin-left:8px}
.stem{font-family:var(--display); font-size:var(--fs-3); font-weight:600; line-height:1.4;
  margin:11px 0 2px}
.stem code, .opt code, .why code, .mini code{font-family:var(--mono); font-size:var(--fs-code);
  background:var(--sunk); padding:1px 5px; border-radius:4px}
pre.out, pre.code{max-width:100%; margin:11px 0 2px; background:var(--sunk); border-radius:var(--r-sm);
  padding:12px 14px; font-family:var(--mono); font-size:var(--fs-code); line-height:1.65;
  overflow-x:auto; white-space:pre}
pre.code .k{color:var(--kw)} pre.code .s{color:var(--str)} pre.code .n{color:var(--num)}
pre.code .c{color:var(--com); font-style:italic} pre.code .f{color:var(--fn)}
pre.code .hl{background:var(--amber-bg); border-radius:3px}
.opt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  background:var(--paper); border:1px solid var(--sep); border-radius:var(--r-sm);
  padding:10px 12px; margin-bottom:7px; cursor:pointer; color:var(--text);
  font-size:var(--fs-6); line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--line); background:var(--fill)}
.opt:disabled{cursor:default}
.opt .ltr{flex:none; width:20px; height:20px; border-radius:50%; background:var(--fill);
  color:var(--text-2); font-size:var(--fs-8); font-weight:700; display:flex;
  align-items:center; justify-content:center; margin-top:1px}
.opt.right{background:var(--green-bg); border-color:var(--green)}
.opt.right .ltr{background:var(--green); color:#fff}
.opt.wrong{background:var(--red-bg); border-color:var(--red)}
.opt.wrong .ltr{background:var(--red); color:#fff}
.fillrow{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap}
.fillrow input{flex:1; min-width:170px; padding:10px 12px; border:1px solid var(--line);
  border-radius:var(--r-sm); background:var(--sunk); color:var(--text);
  font-family:var(--mono); font-size:var(--fs-code); outline:none}
.fillrow input:focus{border-color:var(--blue); background:var(--paper)}
.fillrow input.right{border-color:var(--green); background:var(--green-bg)}
.fillrow input.wrong{border-color:var(--red); background:var(--red-bg)}
.why{margin-top:11px; background:var(--fill); border-radius:var(--r-sm); padding:12px 14px;
  font-size:var(--fs-6); color:var(--text-2); line-height:1.6}
.why b{color:var(--text)}
.nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px}
.btn{appearance:none; border:0; background:var(--fill); color:var(--text);
  border-radius:var(--r-sm); padding:8px 15px; font-size:var(--fs-6); font-weight:600;
  cursor:pointer}
.btn.go{background:var(--blue); color:#fff}
.btn:disabled{opacity:.4; cursor:default}
.count{font-size:var(--fs-7); color:var(--text-3); font-family:var(--mono); white-space:nowrap}
.bar{display:flex; align-items:center; gap:14px; margin-bottom:13px}
.track{flex:1; height:4px; background:var(--sep); border-radius:3px; overflow:hidden}
.track i{display:block; height:100%; background:var(--green); width:0; transition:width .4s var(--ease)}
.done{text-align:center; padding:30px 18px}
.done .score{font-family:var(--display); font-size:46px; font-weight:600; line-height:1}
.bytopic{margin:20px auto 0; max-width:400px; text-align:left}
.bytopic div{display:flex; justify-content:space-between; gap:12px; padding:6px 0;
  border-bottom:1px solid var(--sep); font-size:var(--fs-6)}
.bytopic b{font-family:var(--mono); font-weight:500}
/* data quality */
.dims{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; margin-bottom:14px}
@media (max-width:820px){ .dims{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:520px){ .dims{grid-template-columns:repeat(2,minmax(0,1fr))} }
.dim{appearance:none; text-align:left; background:var(--paper); border:1px solid var(--sep);
  border-radius:var(--r); padding:12px 13px; cursor:pointer; color:var(--text)}
.dim:hover{border-color:var(--line)}
.dim.on{border-color:var(--text); box-shadow:0 0 0 1px var(--text) inset}
.dim .nm{font-family:var(--display); font-size:var(--fs-6); font-weight:600; line-height:1.25}
.dim .sc{font-family:var(--mono); font-size:var(--fs-3); margin-top:8px; letter-spacing:-.02em}
.dim .sc small{font-family:var(--ui); font-size:var(--fs-8); color:var(--text-3)}
.meter{height:3px; background:var(--sep); border-radius:3px; margin-top:6px; overflow:hidden}
.meter i{display:block; height:100%}
.failgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:0 22px}

.q{font-family:var(--display); font-size:var(--fs-3); line-height:1.35; margin-bottom:12px}
.warn{margin-top:13px; background:var(--amber-bg); color:var(--amber); border-radius:var(--r-sm);
  padding:11px 13px; font-size:var(--fs-6); line-height:1.6}
.warn b{display:block; margin-bottom:2px}
.fail{padding:11px 0; border-bottom:1px solid var(--sep)}
.fail:last-child{border-bottom:0}
.fail .ft{font-weight:600; font-size:var(--fs-6); margin-bottom:5px}
.fail .fr{display:grid; grid-template-columns:52px 1fr; gap:7px; font-size:var(--fs-7);
  color:var(--text-2); line-height:1.6; margin-top:4px}
.fail .fr span:first-child{color:var(--text-3); text-transform:uppercase; letter-spacing:.05em;
  font-size:var(--fs-8); padding-top:2px}
.fail code{font-family:var(--mono); font-size:var(--fs-code); background:var(--sunk);
  padding:1px 5px; border-radius:4px; overflow-wrap:anywhere}
.more{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
.mbtn{appearance:none; border:1px solid var(--line); background:transparent; color:var(--text-2);
  border-radius:980px; padding:6px 13px; font-size:var(--fs-7); cursor:pointer}
.mbtn:hover{background:var(--fill); color:var(--text)}
.mbtn.on{background:var(--text); border-color:var(--text); color:var(--bg); font-weight:600}
.mini{width:100%; border-collapse:collapse; font-size:var(--fs-6); table-layout:fixed}
.mini th{text-align:left; font-size:var(--fs-7); font-weight:600; color:var(--text-2);
  padding:7px 10px; border-bottom:1px solid var(--line)}
.mini td{padding:8px 10px; border-bottom:1px solid var(--sep); vertical-align:top;
  line-height:1.55; overflow-wrap:anywhere}
.mini tr:last-child td{border-bottom:0}
/* visualisation explorer */
.vz{display:grid; grid-template-columns:250px 1fr; gap:13px; align-items:start}
@media (max-width:820px){ .vz{grid-template-columns:1fr} }
.sw{flex:none; width:32px; height:19px; border-radius:980px; background:var(--line);
  position:relative; transition:background .18s}
.sw i{position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%;
  background:#fff; transition:transform .18s; box-shadow:0 1px 2px rgba(0,0,0,.3)}
.vopt{display:block; width:100%; text-align:left; background:transparent; border:0;
  border-radius:var(--r-sm); padding:7px 8px; cursor:pointer; color:var(--text);
  font-size:var(--fs-6); margin-bottom:1px}
.vopt:hover{background:var(--fill)}
.vopt .row{display:flex; gap:9px; align-items:center}
.vopt.on .sw{background:var(--blue)}
.vopt.on .sw i{transform:translateX(13px)}
.vopt .nm{flex:1; font-weight:500}
.vnote{color:var(--text-3); font-size:var(--fs-8); line-height:1.5; margin:2px 0 0 41px}
.numrow{display:flex; gap:9px; align-items:center; padding:7px 8px}
.numrow input[type=range]{flex:1; accent-color:var(--blue)}
.numrow .v{font-family:var(--mono); font-size:var(--fs-7); color:var(--blue); font-weight:700;
  min-width:26px; text-align:right}
.libs{display:flex; gap:4px; background:var(--sunk); padding:3px; border-radius:980px;
  width:fit-content}
.lib{appearance:none; border:0; background:transparent; color:var(--text-2);
  border-radius:980px; padding:5px 14px; font-size:var(--fs-7); cursor:pointer;
  font-family:var(--mono)}
.lib.on{background:var(--paper); color:var(--text); font-weight:700;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.plot{width:100%; height:290px}
.rowbar{display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:10px; flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms!important} }
</style>
</head>

es need verification because they were:", "out": "", "code": false, "src": "Oct 1 slides", "options": ["collected without any method", "collected for another purpose", "collected before the question existed", "collected by automated systems"], "correct": 1, "why": "Quick and easy, but somebody else chose what to measure and why.", "n": 22}, {"kind": "mc", "topic": "Data cleaning", "stem": "Which is **not** one of the four quality dimensions on the slide?", "out": "", "code": false, "src": "Oct 1 slides", "options": ["accuracy", "completeness", "precision", "usability"], "correct": 2, "why": "Accuracy, completeness, consistency, usability.", "n": 23}, {"kind": "mc", "topic": "Data cleaning", "stem": "Which issue has **three** possible responses?", "out": "", "code": false, "src": "Oct 1 slides", "options": ["duplicates", "outliers", "stale data", "biased information"], "correct": 1, "why": "Exclude, include or investigate — because it may be an error, a real extreme, or a different population.", "n": 24}, {"kind": "mc", "topic": "Data cleaning", "stem": "**Biased information** calls for:", "out": "", "code": false, "src": "Oct 1 slides", "options": ["removing the bad rows", "fixing the worst values", "caution with the results", "getting new data"], "correct": 3, "why": "No repair fixes a bad sample. Compare stale data, where the answer is caution.", "n": 25}, {"kind": "mc", "topic": "Data cleaning", "stem": "**Stale data** calls for:", "out": "", "code": false, "src": "Oct 1 slides", "options": ["removing the old rows", "fixing the dates", "caution with the results", "collecting it again"], "correct": 2, "why": "You often cannot re-collect it, so you report its age and hedge the conclusion.", "n": 26}, {"kind": "mc", "topic": "Data cleaning", "stem": "You have 40 columns; two of them are 90% blank. The slide says:", "out": "", "code": false, "src": "Oct 1 slides", "options": ["drop those rows", "drop those columns", "fill with 0", "fill with the mean"], "correct": 1,  of bike are in this column?", "out": "Road      61\nHybrid    37\nE-Bike    19\nroad       1\nROAD       1\nhybrid     1", "code": false, "src": "class notebook", "options": ["3", "4", "6", "cannot tell"], "correct": 0, "why": "Three, written six ways — the slide's **inconsistency**. A group-by would report six rows and raise nothing.", "n": 33}, {"kind": "mc", "topic": "Data cleaning", "stem": "This column reports 0 missing and will not sum. The issue is:", "out": "0    $30.00\n1    $10.00\n2    pending\n3    $42.00\ndtype: object", "code": false, "src": "class notebook", "options": ["missing data", "duplicates", "invalid data", "stale data"], "correct": 2, "why": "`'$30.00'` is text, so `isna()` sees nothing wrong. Invalid data → fix or remove.", "n": 34}, {"kind": "mc", "topic": "Data cleaning", "stem": "`df.duplicated().sum()` returns 1 on a file with two identical rows. Why 1?", "out": "", "code": true, "src": "class notebook", "options": ["a bug", "it counts repeats after the first", "it counts columns", "it ignores the first column"], "correct": 1, "why": "The flag answers *which rows do I remove*. `keep=False` marks both copies for looking at.", "n": 35}, {"kind": "mc", "topic": "Data cleaning", "stem": "What does this tell you?", "out": "rows        : 121\nunique ids  : 120\nduplicated(): 1", "code": false, "src": "class notebook", "options": ["one row went missing", "a row was exported twice", "the id column is wrong", "nothing is wrong here"], "correct": 1, "why": "121 rows for 120 ids, one flagged repeat. Duplicates → remove.", "n": 36}, {"kind": "mc", "topic": "Visualisation", "stem": "Which is **not** one of the three purposes on the slide?", "out": "", "code": false, "src": "Visualizations slides", "options": ["record", "analyze", "communicate", "validate"], "correct": 3, "why": "Record, analyze, communicate. Validation is part of cleaning.", "n": 37}, {"kind": "mc", "topic": "Visualisation", "stem": "*Discover errors and find patterns* belongs under 9}, {"kind": "mc", "topic": "Visualisation", "stem": "Which line puts months back in calendar order?", "out": "", "code": true, "src": "class notebook", "options": ["monthly.sort_values()", "monthly.sort_index()", "monthly.reindex(order)", "monthly.head(6)"], "correct": 2, "why": "`reindex` takes the order you name. Sorting re-applies the alphabetical one.", "n": 50}, {"kind": "mc", "topic": "Visualisation", "stem": "What is wrong with this, as input to a line chart?", "out": "Apr  1274.60\nAug  1253.70\nJul  1540.60\nJun  1323.20\nMay  1092.50\nSep  1188.90", "code": false, "src": "class notebook", "options": ["a month is missing", "the order is alphabetical", "the values are wrong", "nothing is wrong"], "correct": 1, "why": "Apr, Aug, Jul, Jun, May, Sep. Plot it and the trend is meaningless while looking normal.", "n": 51}], "dq": {"DIMS": [{"id": "completeness", "name": "Completeness", "one": "is anything missing", "q": "Of the values this table should hold, how many are actually there?", "what": "The share of cells that hold a value. Cheap to compute and the first thing anyone asks — but the number on its own is the least interesting part. <b>Who</b> is missing decides whether you can drop them.", "code": "# per column, and across the table\ndf.isna().sum()\ndf.isna().mean().round(3)\n\n1 - df.isna().sum().sum() / df.size          # one score for the table\n\n# the question that matters: are the blanks random?\ndf.groupby(df[\"father_ed\"].isna())[\"esteem\"].mean()", "blind": "A high score says nothing about whether the gaps are random. If the people with a blank differ from the people without one, every row you drop changes who your answer is about — and completeness cannot see that.", "fails": [["Blank cells", "df.isna().sum()", "Decide per column and say which you chose: drop the rows, fill with a value you can defend, or add a flag column and keep everyone. <code>df[\"edu_missing\"] = df[\"edu\"].isna()</code>"], ["Blanks written as words", "col.unique() shows \"n/a\", \"-\", \"missing\"", "Name them at read time: <code>pd.read_csv(path, na_values=[\"n/a\", \"-\", \"missing\"])</code>. Until you do they are ordinary text, and one text value turns the whole column into text."], ["dropna() with no subset", "the row count falls off a cliff", "<code>df.dropna(subset=[\"the_one_column\"])</code>. A bare <code>dropna()</code> removes any row with a gap anywhere, and takes most of a wide survey with it."], ["Blanks that were filled upstream", "a suspicious pile of zeros or 1900-01-01", "Count them: <code>(df[\"col\"] == 0).sum()</code>. A zero you believe and a zero that means “don't know” are different numbers with the same face."], ["A rule that never fires", "a flag is False for everyone", "Blanks fail every comparison, so <code>NaN < 20</code> is False. Handle missing first, then compare, and report three outcomes: yes, no, and unknown."]]}, {"id": "uniqueness", "name": "Uniqueness", "one": "is anything counted twice", "q": "Does each real-world thing appear exactly once?", "what": "The share of rows that are not repeats, and whether the column you treat as a key really identifies a row. Duplicates never make a number too small, so nothing looks wrong until someone checks a total against the source.", "code": "df.duplicated().sum()                        # exact copies\ndf.drop(columns=[\"id\"]).duplicated().sum()   # copies, ignoring the row id\n\ndf[\"customer_id\"].is_unique                  # is the key a key\ndf[\"customer_id\"].duplicated().sum()\n\nlen(raw) - len(df)                           # what a repair cost you", "blind": "Two rows that look identical may be two real events — the same customer buying the same thing twice on the same day. Uniqueness can find the pairs; only you can say which of them is a mistake.", "fails": [["Exact duplicate rows", "df.duplicated().sum()", "<code>df.drop_duplicates(subset=[c for c in df.columns if c != \"id\"])</code> — the id makes every row unique, so a bare check finds nothing."], ["The same person twice under different ids", "the email or the name repeats", "<code>df.drop_duplicates(subset=[\"email\"], keep=\"last\")</code>, but only once you know which copy is the real one."], ["A key that is not a key", "df[\"id\"].is_unique is False", "Find out why it repeats before dropping anything. Two purchases by one customer are not a duplicated row, and summing per key keeps both."], ["A merge that multiplied rows", "the row count went up", "<code>df.merge(lookup, on=\"key\", how=\"left\", validate=\"many_to_one\")</code> raises the moment the right-hand key is not unique."], ["An export that ran twice", "every total is exactly double", "Check <code>len()</code> against what the source system reports, every single time."]]}, {"id": "validity", "name": "Validity & accuracy", "one": "right shape, and true", "q": "Does every value obey the rules of its column — and does it match the thing in the world?", "what": "Two questions that get confused, and only one of them can be answered from the file. <b>Validity</b> is shape: the type, the format, the range a column claims, all of which a rule can check. <b>Accuracy</b> is truth, and nothing inside a dataset can establish it. A value can pass every rule you write and still be wrong.", "code": "# validity — the rules come from the column, so a computer can check them\ndf.dtypes\ndf.describe()\n\nassert df[\"amount\"].notna().all()\nassert (df[\"amount\"] > 0).all()\nassert df[\"beds\"].between(1, 30).all()\nassert df[\"type\"].isin([\"Single Family\", \"Multi Family\"]).all()\n\n# accuracy — the rules come from the world, so they cost shoe leather\nmerged = df.merge(source_of_truth, on=\"record\", suffixes=(\"\", \"_true\"))\n(merged[\"amount\"] != merged[\"amount_true\"]).sum()     # against a second source\n\ndf.sample(30, random_state=0)                          # or check by hand\ndf.loc[df[\"record\"] == 5759, \"baths\"] = 4              # then fix by key, never by position", "blind": "The score beside this card is validity only, and that is the whole lesson: $215,000 is a perfectly valid number for a house that actually sold for $251,000. Every dimension on this page can be computed in a second and none of them touches accuracy — a table can score 100% on all of them and still describe the wrong month.", "fails": [["A date stored as a number", "dtypes says int64 on a date column", "<code>pd.to_datetime(col, unit=\"D\", origin=\"1899-12-30\")</code>. Excel counts days from 30 December 1899; without <code>origin</code> every date lands in 1970 and nothing errors.", "rule"], ["A date stored as text", "dates sorting alphabetically", "<code>pd.to_datetime(col, format=\"mixed\", errors=\"coerce\")</code> — then count the NaTs it created. A coerce that quietly eats half the column is worse than an error.", "rule"], ["Money or counts as text", "sum() glues the strings together", "Strip <code>$</code> and <code>,</code> first, then <code>pd.to_numeric(..., errors=\"coerce\")</code>.", "rule"], ["An id read as a number", "00042 became 42", "<code>pd.read_csv(path, dtype={\"store_id\": str})</code>. An id is a label, not a quantity — nothing you would add up belongs in it.", "rule"], ["Impossible values", "describe() shows 43 bathrooms, an age of 999", "Flag and investigate before you repair. Impossible is not the same as unusual, and the arithmetic cannot tell an error from a real extreme.", "rule"], ["Numbers and text in one column", "dtypes says object on a numeric field", "<code>df[\"col\"].apply(type).value_counts()</code>. Something was typed into a numeric field, and one column holds one kind of thing.", "rule"], ["A value that is merely wrong", "nothing — it passes every rule", "A second source, or a sample checked by hand. There is no test for this inside the file, which is why the score above cannot see it.", "person"], ["A correction applied by position", "the fix moves when the table is sorted", "<code>df.loc[df[\"id\"] == 5759, \"baths\"] = 4</code> — address the row by its key, never by <code>df.loc[2]</code>.", "person"], ["A blanket rule dressed as a fix", "np.where(col > 10, 4, col)", "That rewrites every large value, including the ones that were right. Repair only the rows you have actually checked.", "person"], ["Cleaning that nobody can reconstruct", "the spreadsheet was edited", "Never edit the raw file. Read it, <code>.copy()</code> it, change the copy in code, and count what you lost: <code>len(raw) - len(df)</code>.", "person"]]}, {"id": "consistency", "name": "Consistency", "one": "does it agree with itself", "q": "Is one thing always written the same way, here and everywhere else?", "what": "The share of values in their canonical form. “Ames”, “ames ” and “ AMES” are one town to a reader and three categories to a group-by, so every count built on them is wrong without a single error.", "code": "df[\"town\"].value_counts()                   # look before you fix\n\ndf[\"town\"] = df[\"town\"].str.strip().str.title()\ndf[\"state\"] = df[\"state\"].replace({\"N.Y.\": \"NY\", \"new york\": \"NY\"})\n\n# and the names of the columns themselves\ndf.columns = df.columns.str.strip().str.lower().str.replace(\" \", \"_\")", "blind": "No string method knows that “new york” means NY. That is domain knowledge, and it belongs in an explicit mapping somebody can read and disagree with — not in a clever regular expression.", "fails": [["Case and stray spaces", "value_counts() shows the same label twice", "<code>col.str.strip().str.title()</code>. Either repair alone leaves the other, so do both and look at the counts again."], ["Different spellings of one thing", "N.Y., new york, NY", "An explicit <code>col.replace({...})</code> mapping. Slicing the first two letters would turn Colorado and Connecticut into the same state."], ["Units nobody documented", "two columns of plausible numbers that disagree", "Find the definition before you combine them. Square feet and square metres both look like numbers."], ["Column  total changed since you reported it", "Record when you pulled the data, and say so next to the number."]]}], "WHOLES": [["The row count does not match what you were promised", "A partial export ruins more analyses than any statistical mistake, and it never announces itself.", "len(df)   # against what the source system says"], ["A totals row at the bottom", "Spreadsheets grow these. Left in, it doubles every total and lands in every mean — and it looks like an ordinary row from the top of the file.", "df.tail()\ndf = df.iloc[:-1]"], ["A join that changed the row count", "Fewer rows means it silently dropped data; more means it duplicated it. Both are wrong and neither raises an error.", "len(df)          # before\nlen(merged)      # after — say why they differ"], ["Two levels of detail in one table", "One row per order and one row per order line look the same until you sum the order total and get it once per line.", "df.groupby(\"order_id\").size().value_counts()"], ["A title, a blank line, or notes above the header", "The first row of the file is not always the header, and pandas will happily use a title as one.", "pd.read_csv(path, skiprows=3)\npd.read_excel(path, usecols=\"B:F\")"], ["Columns that are all blank, or never vary", "A field the export was asked for and could not fill, or a filter somebody applied upstream without saying so.", "df.nunique()\ndf.isna().all()"]], "STEPS": [["Look before you touch", "shape, head, tail, dtypes, info, describe, value_counts. Thirty seconds."], ["Write down what you expect", "the row count, the types, the range, the categories. Now you have something to be wrong about."], ["Measure, do not guess", "count the blanks, the duplicates, the values that fail each rule. Numbers, not impressions."], ["Repair one thing at a time", "and check the row count after each. A repair that changes <code>len(df)</code> without you meaning it is a bug."], ["Turn the expectations into asserts", "so next quarter's export stops the notebook instead of producing a plausible wrong number."], ["Write down what you did", "which rows you dropped, which blanks you filled, and why. That paragraph belongs under the table."]], "FLOWS": {"completeness": {"title": "So there are blanks. Now what?", "lede": "Rows, columns, both, fill, or flag — five different answers, and which one is right depends on four questions asked in this order. Work down. Most columns stop before the end.", "start": "A column has blank cells", "steps": [{"q": "1 · Is the blank a value in disguise?", "note": "Before anything else, look at what is actually in the column: <code>df[\"col\"].unique()</code>. A form that wrote “n/a”, a database that wrote <code>NULL</code> as text, an export that wrote 0 or 1900-01-01 — none of these are blank yet, and none of them will be counted by <code>isna()</code>.", "br": [{"c": "yes — words or sentinels", "k": "care", "d": "Turn them into real blanks first", "p": "Everything below this point is wrong until you do. A single text value also drags the whole column to <code>object</code>, so no arithmetic works either.", "code": "pd.read_csv(path, na_values=[\"n/a\", \"-\", \"missing\", \"NULL\"])\n\n# already loaded:\ndf[\"col\"] = pd.to_numeric(df[\"col\"], errors=\"coerce\")"}, {"c": "no — they are genuinely empty", "k": "go", "d": "Carry on to question 2", "p": "<code>df.isna().sum()</code> is now telling you the truth."}]}, {"q": "2 · How much of the column is missing?", "note": "<code>df.isna().mean().sort_values(ascending=False)</code> — the share per column, worst first. This is the only question where the number alone decides.", "br": [{"c": "almost all of it — say 70%+", "k": "stop", "d": "Drop the column", "p": "There is nothing to analyse and nothing honest to fill it with. Say in your notes that you dropped it and why — a reader will wonder where it went.", "code": "df = df.drop(columns=[\"col\"])"}, {"c": "a real share — 5% to 70%", "k": "care", "d": "Keep the column. Go to question 3", "p": "This  and whichever you choose, count what it cost and keep a flag.", "code": "before = len(df)\ndf = df.dropna(subset=[\"col\"])    # never a bare dropna()\nprint(before - len(df), \"rows dropped\")"}]}], "end": "<b>And whatever you chose, write it under the table.</b> “Rows missing a salary were excluded (412 of 12,686, 3.2%); they were younger on average than the rows kept.” That sentence is the difference between reporting and misleading — and it is the part a reader cannot reconstruct from your output.", "matrix": {"head": ["What you do", "When it is right", "What it costs you", "The line"], "rows": [["Do nothing", "You are describing the data, and every statistic can skip blanks on its own.", "Different columns end up with different n, so the reader has to be told.", "<code>df[\"col\"].mean()</code>"], ["Drop rows", "The column is essential to the question, and the blanks look random.", "Every other column of those rows goes too. A bare <code>dropna()</code> can take a quarter of a wide survey.", "<code>df.dropna(subset=[\"col\"])</code>"], ["Drop the column", "Almost all of it is missing, or nothing depends on it.", "The variable is gone from every later analysis, including ones you have not thought of yet.", "<code>df.drop(columns=[\"col\"])</code>"], ["Both", "A handful of unusable columns, then a handful of unusable rows — in that order.", "Do the columns first, or you will drop rows to save a column you were going to delete anyway.", "<code>df.drop(columns=dead).dropna(subset=key)</code>"], ["Impute", "Something downstream needs a complete matrix and the blanks look random.", "You invented data. The mean stays put and <b>the standard deviation falls</b>, so every spread and every confidence interval is now too narrow.", "<code>df[\"col\"].fillna(df[\"col\"].median())</code>"], ["Flag and keep", "The blanks are not random — or you are not sure.", "Nothing, which is why it is the safe default. You gain a column and lose no rows.", "<code>df[\"col_missing\"] = df[\"col\"].isna()</code>"]]}, "imputes": {"head": ["If you must fill", "Use it when", "What it does to the data"], "rows": [["Median", "A skewed numeric column — the usual choice.", "Safest single value, but every filled row is now identical and the spread shrinks."], ["Mean", "A roughly symmetric numeric column.", "Keeps the mean exactly, shrinks the SD hardest of all. Never report the SD afterwards without saying you filled."], ["Mode", "A category, or a discrete count.", "Makes the most common answer more common, so any share you quote is overstated."], ["A group's median", "The column varies by an obvious group — town, department, year.", "Better than one global value, and honest about the structure you already believe in."], ["Forward fill", "A time series where the last known value still holds.", "<code>df[\"col\"].ffill()</code> — wrong the moment a gap is long, and it invents a flat line."], ["A constant you name", "“Not applicable” really is the answer — 0 siblings, 0 previous claims.", "Fine, and the only case where filling adds information rather than removing it. Say which constant and why."]]}}, "uniqueness": {"title": "Two rows look the same. Which is it?", "lede": "A repeat is not automatically a duplicate. Three different things produce identical-looking rows, and each wants a different repair.", "start": "A row, or a key, appears more than once", "steps": [{"q": "1 · Did you check with the id column in or out?", "note": "A row id makes every row unique, so <code>df.duplicated()</code> finds nothing and the file looks clean. This is the most common false all-clear in the whole topic.", "br": [{"c": "with the id in", "k": "stop", "d": "Check again without it", "p": "Otherwise you are asking whether two rows have different id numbers, which they always do.", "code": "df.drop(columns=[\"record\"]).duplicated().sum()"}, {"c": "without it", "k": "go", "d": "Go to question 2", "p": ""}]}, {"q": "2 · Is every column identical, or only the key?", "note": "<co e export that you would rather know now."}, "validity": {"title": "A value fails its rule. Repair, remove, or investigate?", "lede": "The order matters: understand it, then repair it, and only ever delete what you can explain.", "start": "A value is the wrong type, format or range", "steps": [{"q": "1 · Is it the type that is wrong, or the value?", "note": "<code>df.dtypes</code> first. A whole column arriving as text is a reading problem and has a clean fix; a single impossible number is a data problem and does not.", "br": [{"c": "the whole column", "k": "go", "d": "Convert it, and count the casualties", "p": "Strip the symbols, then coerce — and immediately check how many values became blank. That count is the real finding.", "code": "clean = pd.to_numeric(df[\"amount\"].str.replace(\"$\", \"\", regex=False)\n                       .str.replace(\",\", \"\", regex=False), errors=\"coerce\")\nprint(clean.isna().sum() - df[\"amount\"].isna().sum(), \"values lost\")"}, {"c": "a few values", "k": "care", "d": "Go to question 2", "p": ""}]}, {"q": "2 · Is it impossible, or merely unusual?", "note": "Impossible you can rule out from knowledge alone — a negative age, a 13th month. Unusual you cannot: 43 bathrooms might be a typo, an apartment block, or the most important row in the file.", "br": [{"c": "impossible", "k": "care", "d": "Set it to blank, then treat it as missing", "p": "It is not a number you can use and it is not a number you can trust. Turning it into a blank puts it back on the completeness path above, where there is already a decision procedure for it.", "code": "df.loc[df[\"age\"] > 120, \"age\"] = np.nan"}, {"c": "unusual", "k": "stop", "d": "Flag it. Do not touch it yet", "p": "Deleting before you understand is how a genuine apartment block disappears from the analysis — and how a fraud case does.", "code": "q1, q3 = df[\"baths\"].quantile([.25, .75])\niqr = q3 - q1\ndf[\"baths_flag\"] = ~df[\"baths\"].between(q1 - 1.5*iqr, q3 + 1.5*iqr)"}]}, {"q": " <div class="app">
  <div class="top">
    <h1>Cleaning, statistics and charts</h1>
    <button class="ghost" id="theme">Light / dark</button>
  </div>
  <p class="lede">Three tabs: what to check in a dataset, practice questions from the slides and
    notebooks, and a chart-code explorer for matplotlib, seaborn and plotly.</p>
  <div class="tabs" id="tabs"></div>
  <div id="stage"></div>
</div>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const QS = D.questions, DQ = D.dq, VZ = D.viz;
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c;
  if(x !== undefined) e.textContent = x; return e; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
                      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
                      .replace(/\*([^*]+)\*/g, "<i>$1</i>");
const raw = s => String(s);
const norm = s => String(s).trim().toLowerCase().replace(/^["']|["']$/g, "").replace(/\s+/g, " ");

/* ═════════════════════════════ 1 · data quality ══════════════════════════════ */
let DIM = 0, EXTRA = null;
const EXTRAS = [["wholes", "Whole-table problems"], ["steps", "The order you do it in"],
                ["cat", "Reference"]];
function renderDQ(){
  const stage = $("stage"); stage.innerHTML = "";
  const lead = el("div", "card");
  lead.appendChild(el("h2", null, "Data quality is fitness for the decision"));
  lead.innerHTML += '<p class="sub2">There is no such thing as clean data, only data clean enough ' +
    'for the question you are about to ask. Quality is never one score — it is a handful of ' +
    'measurements, each answering a different question, and each with something it cannot see.</p>';
  stage.appendChild(lead);

  const dims = el("div", "dims");
  DQ.DIMS.forEach((d, i) => {
    const b = el("button", "dim" + (DIM === i ? " on" : ""));
    b.appendChild(el("div", "nm", d.name));
    b.appendChild(el("div", "vnote", d.one || ""));
    b.onclick = () => { DIM = i; renderDQ(); };
    dims.appendChild(b);
  });
  stage.appendChild(dims);

  const d = DQ.DIMS[DIM];
  const left = el("div", "card");
  left.appendChild(el("h2", null, d.name));
  const what = el("p", "sub2"); what.innerHTML = d.what || ""; left.appendChild(what);
  left.appendChild(el("h3", null, "The question it answers"));
  const q = el("div", "q"); q.innerHTML = d.q || ""; left.appendChild(q);
  left.appendChild(el("h3", null, "How you compute it"));
  left.appendChild(el("pre", "out", d.code || ""));
  if(d.blind){
    const w = el("div", "warn");
    w.innerHTML = "<b>What this measurement cannot see</b>" + d.blind;
    left.appendChild(w);
  }
  stage.appendChild(left);

  const fails = el("div", "card");
  fails.appendChild(el("h2", null, "How it fails, and what you do"));
  const grid = el("div", "failgrid");
  (d.fails || []).forEach(f => {

const TOPICS = [...new Set(QS.map(q => q.topic))];
let TOPIC = "All", POS = 0, PICKED = {}, TYPED = {};
const pool = () => QS.filter(q => TOPIC === "All" || q.topic === TOPIC);
const isRight = q => q.kind === "fill" ? PICKED[q.n] === true : PICKED[q.n] === q.correct;

function renderQ(){
  const stage = $("stage"); stage.innerHTML = "";
  const chips = el("div", "tabs");
  ["All"].concat(TOPICS).forEach(t => {
    const n = t === "All" ? QS.length : QS.filter(q => q.topic === t).length;
    const b = el("button", "tab" + (TOPIC === t ? " on" : ""), t + " " + n);
    b.onclick = () => { TOPIC = t; POS = 0; renderQ(); };
    chips.appendChild(b);
  });
  stage.appendChild(chips);

  const list = pool();
  const answered = list.filter(q => PICKED[q.n] !== undefined).length;
  const right = list.filter(isRight).length;
  const bar = el("div", "bar");
  const track = el("div", "track"); const fl = el("i");
  fl.style.width = (100 * answered / list.length) + "%";
  track.appendChild(fl); bar.appendChild(track);
  bar.appendChild(el("span", "count",
    right + " right of " + answered + " · " + list.length + " in this set"));
  stage.appendChild(bar);

  if(POS >= list.length){ stage.appendChild(qSummary(list)); return; }
  const q = list[POS], card = el("div", "card"), head = el("div");
  head.appendChild(el("span", "tag", q.topic));
  head.appendChild(el("span", "kind", q.kind === "fill" ? "type your answer" : "choose one"));
  if(q.src) head.appendChild(el("span", "kind", q.src));
  card.appendChild(head);
  const stem = el("div", "stem"); stem.innerHTML = md(q.stem); card.appendChild(stem);
  if(q.out) card.appendChild(el("pre", "out", q.out));
  const picked = PICKED[q.n];

  if(q.kind === "fill"){
    const row = el("div", "fillrow");
    const inp = document.createElement("input");
    inp.type = "text"; inp.spellcheck = false; inp.autocomplete = "off";
    inp.placeholder = "your answer"; inp.value = TYPED[q.n] || "";
    if(picked !== undefined){ inp.disabled = true; inp.className = picked ? "right" : "wrong"; }
    inp.oninput = e => { TYPED[q.n] = e.target.value; };
    const go = el("button", "btn go", "Check"); go.disabled = picked !== undefined;
    const submit = () => { if(PICKED[q.n] !== undefined) return;
      PICKED[q.n] = q.accept.indexOf(norm(TYPED[q.n] || "")) >= 0; renderQ(); };
    go.onclick = submit;
    inp.onkeydown = e => { if(e.key === "Enter") submit(); };
    row.appendChild(inp); row.appendChild(go); card.appendChild(row);
    if(picked !== undefined){
      const w = el("div", "why");
      w.innerHTML = (picked ? "<b>Right. </b>"
        : "<b>Not quite — the answer is <code>" + esc(q.answer) + "</code>. </b>") + md(q.why);
      card.appendChild(w);
    }
    setTimeout(() => { if(!inp.disabled) inp.focus(); }, 0);
  } else {
    q.options.forEach((o, i) => {
      const b = el("button", "opt" + (picked === undefined ? ""
        : (i === q.correct ? " right" : (i === picked ? " wrong" : ""))));
      b.disabled = picked !== undefined;
      b.appendChild(el("span", "ltr", "ABCD"[i]));
      const s = el("span"); s.innerHTML = q.code ? "<code>" + esc(o) + "</code>" : md(o);
      b.appendChild(s);
      b.onclick = () => { PICKED[q.n] = i; renderQ(); };
      card.appendChild(b);
    });
    if(picked !== undefined){
      const w = el("div", "why");
      w.innerHTML = (picked === q.correct ? "<b>Right. </b>" : "<b>Not quite. </b>") + md(q.why);
      card.appendChild(w);
    }
  }
  const nav = el("div", "nav");
  const prev = el("button", "btn", "← Previous"); prev.disabled = POS === 0;
  prev.onclick = () => { POS--; renderQ(); };
  const mid = el("span", "count", (POS + 1) + " of " + list.length);
  const next = el("button", "btn" + (PICKED[q.n] !== undefined ? " go" : ""),
    POS === list.length - 1 ? "Finish →" : "Next →");
  next.onclick = () => { POS++; renderQ(); };
  nav.appendChild(prev); nav.appendChild(mid); nav.appendChild(next);
  card.appendChild(nav);
  stage.appendChild(card);
}
function qSummary(list){
  const card = el("div", "card"), done = el("div", "done");
  const right = list.filter(isRight).length;
  done.appendChild(el("div", "score", right + " / " + list.length));
  const by = el("div", "bytopic");

    by.appendChild(row);

  const nav = el("div", "nav"); nav.style.justifyContent = "center";
  const back = el("button", "btn", "← Review"); back.onclick = () => { POS = 0; renderQ(); };
  const again = el("button", "btn go", "Start again");
  again.onclick = () => { PICKED = {}; TYPED = {}; POS = 0; renderQ(); };
  nav.appendChild(back); nav.appendChild(again); done.appendChild(nav); card.appendChild(done);

}

/* ═════════════════════════════ 3 · chart code explorer ══════════════════════ */
let CHART = VZ.order[0], LIB = "mpl", OPTS = {}, PREV = "", FIRST = true;

function defaults(ch){
  const o = {};
  VZ.charts[ch].options.forEach(x => o[x.id] = x.default);
  return o;
}
OPTS = defaults(CHART);

/* ── the same renderer the build script used, so the code matches what was tested ── */
function derive(table, opts){
  const out = {};
  for(const tok in table){
    const r = table[tok];
    const key = r.opts.map(o => opts[o] ? "1" : "0").join(",");
    out[tok] = (key in r.map) ? r.map[key] : r.default;
  }
  return out;
}
function subst(line, vals){
  return line.replace(/\{\{(\w+)\}\}/g, (m, k) => {
    const v = vals[k];
    if(v === true) return "True";
    if(v === false) return "False";
    return String(v);
  });
}
function buildCode(ch, lib, opts){
  const spec = VZ.charts[ch];
  const vals = Object.assign({}, opts, derive(spec.derive, opts));
  const out = [];
  spec.rules[lib].forEach(r => {
    if(r["if"] && !opts[r["if"]]) return;
    if(r["ifNot"] && opts[r["ifNot"]]) return;
    r.lines.forEach(ln => out.push(subst(ln, vals)));
  });
  return out.join("\n");
}

/* ── syntax colouring, enough for Python ── */
function highlight(src, prevSrc){
  const prev = new Set((prevSrc || "").split("\n"));
  return src.split("\n").map(line => {
    let h = esc(line);
    h = h.replace(/(#.*)$/g, '<span class="c">$1</span>');
    if(!/<span class="c">/.test(h)){
      h = h.replace(/("[^"]*"|'[^']*')/g, '<span class="s">$1</span>');
      h = h.replace(/\b(import|from|as|for|in|if|else|True|False|None|lambda)\b/g,
                    '<span class="k">$1</span>');
      h = h.replace(/\b(\d+\.?\d*)\b/g, '<span class="n">$1</span>');
      h = h.replace(/\.([a-z_]+)\(/g, '.<span class="f">$1</span>(');
    }
    const isNew = line.trim() && !prev.has(line);
    return isNew && prevSrc ? '<span class="hl">' + h + "</span>" : h;
  }).join("\n");
}

/* ── preview, drawn with plotly.js ── */
const C1 = "#4C8BF5", C2 = "#E8833A", C3 = "#2BA87E", GREY = "#C9CFDA", RED = "#C8102E";
function layout(extra){
  const dark = (document.documentElement.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  return Object.assign({
    margin: {l: 55, r: 18, t: 38, b: 46},
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: {family: "Public Sans, sans-serif", size: 12, color: dark ? "#A1A1A6" : "#5A5A5F"},
    showlegend: false, height: 300, hovermode: "closest",
    xaxis: {showgrid: false, zeroline: false}, yaxis: {showgrid: false, zeroline: false},
  }, extra || {});
}
function draw(){
  const d = VZ.charts[CHART].data, o = OPTS;
  let traces = [], lay = {};

  if(CHART === "bar"){
    const lab = o.sort ? d.labels : d.alpha_labels;
    const val = o.sort ? d.values : d.alpha_values;
    const cols = o.one ? lab.map((_, i) => i === lab.length - 1 ? RED : GREY) : lab.map(() => C1);
    traces = [{type: "bar", orientation: o.horiz ? "h" : "v",
      x: o.horiz ? val : lab, y: o.horiz ? lab : val,
      marker: {color: o.one ? (o.sort ? cols : lab.map(l => l === "South" ? RED : GREY)) : C1},
      text: o.labels ? val.map(v => v.toFixed(0)) : null,
      textposition: "outside", cliponaxis: false}];
    lay = {title: o.title ? "South brings in the most revenue" : "",
      xaxis: {title: o.horiz ? (o.title ? "revenue ($)" : "") : "", showgrid: o.horiz && o.grid},
      yaxis: {title: !o.horiz && o.title ? "revenue ($)" : "", showgrid: !o.horiz && o.grid}};
  }

  if(CHART === "pie"){
    traces = [{type: "pie", labels: d.labels, values: d.values,
      hole: o.donut ? 0.45 : 0,
      pull: o.pull ? [0, 0, 0.08] : 0,
      rotation: o.start ? 0 : 90,
      textinfo: (o.pct && !o.legend) ? "label+percent" : (o.pct ? "percent"
                 : (o.legend ? "none" : "label")),
      marker: {colors: [C1, C2, C3]}, sort: false}];
    lay = {showlegend: !!o.legend,
      title: o.title ? "Road bikes bring in the largest share" : "",
      margin: {l: 20, r: 20, t: 38, b: 20}};
  }

  if(CHART === "hist"){
    const lo = Math.min(...d.values), hi = Math.max(...d.values);
    traces = [{type: "histogram", x: d.values,
      xbins: {start: lo, end: hi, size: (hi - lo) / o.bins},
      cumulative: {enabled: !!o.cum},
      histnorm: o.dens ? "probability density" : "",
      marker: {color: C1, line: {color: "#fff", width: o.edge ? 1 : 0}}}];
    lay = {title: o.title ? "Most rentals are small; a few are not" : "",
      xaxis: {title: o.title ? "amount ($)" : ""},
      yaxis: {title: o.title ? (o.dens ? "proportion" : "rentals") : ""},
      bargap: 0.02,
      shapes: o.mean ? [{type: "line", x0: d.mean, x1: d.mean, y0: 0, y1: 1,
        yref: "paper", line: {color: RED, dash: "dash", width: 2}}] : []};
  }

  if(CHART === "box"){
    traces = d.groups.map((g, i) => ({type: "box",
      [o.horiz ? "x" : "y"]: d.values[i], name: g,
      boxmean: !!o.means, notched: !!o.notch,
      boxpoints: o.points ? "all" : "outliers", jitter: 0.4, pointpos: 0,
      marker: {color: o.colour ? [C1, C2, C3][i] : C1},
      line: {color: o.colour ? [C1, C2, C3][i] : C1}}));
    lay = {title: o.title ? "E-Bike rentals cost more, and vary more" : "",
      [o.horiz ? "xaxis" : "yaxis"]: {title: o.title ? "amount ($)" : ""}};
  }

  if(CHART === "line"){
    traces = [{type: "scatter", x: d.x, y: d.y,
      mode: o.marker ? "lines+markers" : "lines",
      fill: o.fill ? "tozeroy" : "none", fillcolor: "rgba(76,139,245,.2)",
      line: {color: C1, width: 2, dash: o.dash ? "dash" : "solid"},
      marker: {color: C1, size: 7}}];
    lay = {title: o.title ? "Revenue peaks in July" : "",
      xaxis: {title: o.title ? "month" : ""},

      annotations: o.annot ? [{x: d.peak, y: d.peak_v, ax: 42, ay: -34,
        text: "July: $" + d.peak_v.toFixed(0), showarrow: true, arrowhead: 2}] : []};
  }

  if(CHART === "multiline"){
    const keys = Object.keys(d.series);
    traces = keys.map((k, i) => ({type: "scatter", x: d.x, y: d.series[k], name: k,
      mode: o.marker ? "lines+markers" : "lines",
      line: {color: o.one ? (k === "E-Bike" ? RED : GREY) : [C1, C2, C3][i], width: 2},
      marker: {size: 6}}));

      title: o.title ? "E-Bike revenue swings hardest across the season" : "",
      yaxis: {title: o.title ? "revenue ($)" : "", showgrid: !!o.grid,
              range: o.zero ? [0, Math.max(...all) * 1.15] : undefined}};
  }

  if(CHART === "scatter"){
    const pts = d.points, groups = [...new Set(pts.map(p => p.g))];
    const mk = sel => ({
      type: "scatter", mode: "markers",
      x: sel.map(p => p.x), y: sel.map(p => p.y),
      marker: {size: o.size ? sel.map(p => p.s * 2.6) : 7,

      });
    } else {
      const t = mk(pts); t.marker.color = C1; traces = [t];
    }
    if(o.trend){
      const n = pts.length, sx = pts.reduce((s, p) => s + p.x, 0),
            sy = pts.reduce((s, p) => s + p.y, 0),
            sxy = pts.reduce((s, p) => s + p.x * p.y, 0),
            sxx = pts.reduce((s, p) => s + p.x * p.x, 0);
      const m = (n * sxy - sx * sy) / (n * sxx - sx * sx), b = (sy - m * sx) / n;
      const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
      traces.push({type: "scatter", mode: "lines", x: [x0, x1],
        y: [m * x0 + b, m * x1 + b], line: {color: RED, width: 1.5}, showlegend: false});
    }

      title: o.title ? "Longer rentals cost more" : "",
      xaxis: {title: o.title ? "hours" : "", showgrid: !!o.grid},
      yaxis: {title: o.title ? "amount ($)" : "", showgrid: !!o.grid}};
  }

  Plotly.react("plot", traces, layout(lay), {displayModeBar: false, responsive: true});
}

  const copy = el("button", "btn", "Copy code");
  copy.onclick = () => {
    const text = VZ.setup + "\n\n" + buildCode(CHART, LIB, OPTS);
    navigator.clipboard.writeText(text).then(() => {
      copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy code", 1200);
    }).catch(() => { copy.textContent = "Select and copy"; });
  };
  bar.appendChild(copy);
  codecard.appendChild(bar);
  const setup = el("div", "count"); setup.id = "vsetup"; setup.style.marginBottom = "8px";
  codecard.appendChild(setup);
  const code = el("pre", "code"); code.id = "vcode"; codecard.appendChild(code);
  const tip = el("div", "why"); tip.id = "vtip"; codecard.appendChild(tip);
  rightcol.appendChild(codecard);
  grid.appendChild(rightcol);
  stage.appendChild(grid);

  if(!VZ_BUILT){ OPTS = defaults(CHART); VZ_BUILT = true; }
  PREV = ""; FIRST = true;
  renderAll();
}

/* ═════════════════════════════ shell ════════════════════════════════════════ */
const TABS = [["Data quality", renderDQ], ["Practice questions", renderQ],
              ["Chart code", renderVZ]];
let TAB = 0;
function renderTabs(){
  const host = $("tabs"); host.innerHTML = "";
  TABS.forEach(([name, fn], i) => {
    const b = el("button", "tab" + (TAB === i ? " on" : ""), name);
    b.onclick = () => { TAB = i; renderTabs(); fn(); window.scrollTo({top: 0}); };
    host.appendChild(b);
  });
}
$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  if(TAB === 2) draw();
};
renderTabs(); TABS[0][1]();
window.__m = {D, go: i => { TAB = i; renderTabs(); TABS[i][1](); },
  answerAll: () => { QS.forEach(q => { if(q.kind === "fill"){ TYPED[q.n] = q.answer;
      PICKED[q.n] = q.accept.indexOf(norm(q.answer)) >= 0; } else PICKED[q.n] = q.correct; });
      renderQ(); return QS.filter(isRight).length; },
  setChart: (c, l) => { CHART = c; LIB = l; OPTS = defaults(c); PREV = ""; FIRST = true;
      renderAll(); return buildCode(c, l, OPTS); },
  dim: i => { DIM = i; renderDQ(); }, extra: k => { EXTRA = k; renderDQ(); }};
</script>
